[metadata]
name = toxic-comments-project
version = 1.0.0
description = Reproducible toxic-comment classification project

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10,<3.13
install_requires =
    joblib==1.5.3
    matplotlib==3.10.9
    numpy==2.2.6
    pandas==2.3.3
    pyarrow==24.0.0
    scikit-learn==1.7.2
    streamlit==1.61.1

[options.packages.find]
where = src

[options.extras_require]
transformer =
    accelerate==1.10.1
    datasets==4.1.1
    torch==2.8.0
    transformers==4.56.2
dev =
    pytest==8.4.2
    ruff==0.15.22
report =
    reportlab==4.4.10
